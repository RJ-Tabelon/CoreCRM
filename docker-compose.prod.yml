services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      NODE_ENV: production
      ARCJET_ENV: production
      PORT: 3000
      # Inject this at runtime (do not commit secrets)
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ARCJET_KEY: ${ARCJET_KEY:-}
    expose:
      - '3000'
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped
