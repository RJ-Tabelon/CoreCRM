name: Lint and Format Check

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run ESLint
        id: eslint
        run: npm run lint
        working-directory: ./backend
        continue-on-error: true

      - name: Run Prettier check
        id: prettier
        run: npm run format:check
        working-directory: ./backend
        continue-on-error: true

      - name: Comment on PR with suggestions
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const eslintFailed = '${{ steps.eslint.outcome }}' === 'failure';
            const prettierFailed = '${{ steps.prettier.outcome }}' === 'failure';
            let comment = '## ⚠️ Code Quality Issues Found\n\n';

            if (eslintFailed) {
              comment += '### ESLint Issues\n';
              comment += 'Run `npm run lint:fix` to automatically fix linting issues.\n\n';
            }

            if (prettierFailed) {
              comment += '### Prettier Formatting Issues\n';
              comment += 'Run `npm run format` to format the code according to project standards.\n\n';
            }

            if (eslintFailed || prettierFailed) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

      - name: Fail workflow if issues found
        if: failure()
        run: |
          echo "::error::Linting or formatting issues found. Please run 'npm run lint:fix' and 'npm run format' to fix them."
          exit 1
