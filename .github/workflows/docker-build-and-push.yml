name: Build, Push, and Deploy (EC2)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            image: core-crm-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: frontend
            image: core-crm-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag,enable={{is_tag}}
            type=semver,pattern={{version}},enable={{is_tag}}

      - name: Build and push Docker image (${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Deploy via SSH (docker compose pull/up)
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GIT_REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PUBLIC_HOST: ${{ secrets.EC2_HOST }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,GIT_REF_TYPE,REF_NAME,SHA,PUBLIC_HOST
          script: |
            set -euo pipefail

            cd ~/core-crm

            if [ "$GIT_REF_TYPE" = "tag" ]; then
              IMAGE_TAG="$REF_NAME"
            else
              IMAGE_TAG="${SHA:0:7}"
            fi

            printf "DOCKER_USERNAME=%s\nIMAGE_TAG=%s\n" "$DOCKER_USERNAME" "$IMAGE_TAG" > .env

            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans

            # Optional housekeeping. Safe on single-host deployments where you don't roll back often.
            docker image prune -f

            docker compose ps
            echo "Deployed: http://$PUBLIC_HOST/ (API: http://$PUBLIC_HOST/api)"
