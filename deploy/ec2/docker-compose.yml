services:
  backend:
    image: ${DOCKER_USERNAME}/core-crm-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    expose:
      - '3000'
    restart: unless-stopped

  frontend:
    image: ${DOCKER_USERNAME}/core-crm-frontend:${IMAGE_TAG:-latest}
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
